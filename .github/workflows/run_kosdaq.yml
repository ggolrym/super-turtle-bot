name: 🇰🇷 KOSPI Bot

on:
  schedule:
    - cron: '25 3 * * 1-5' # KST 15:05 실행
  workflow_dispatch:

concurrency:
  group: turtle-bot-run
  cancel-in-progress: true # 💡 [수정] 이전 작업이 멈춰있으면 자비 없이 강제 취소

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 💡 [추가] 코드가 10분 이상 멈춰있으면 자동 에러 처리 (6시간 지연 방지)
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade pip
      - run: pip install yfinance pandas finance-datareader requests google-genai pytz
      - run: python turtle_bot.py
        env:
          RUN_MARKET: KOSDAQ
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
