name: Turtle Bot Auto Run

on:
  schedule:
    # 한국장 마감 직전: 한국시간(KST) 오후 3시 17분 = UTC 오전 6시 17분
    - cron: '17 6 * * 1-5'
    
    # 미국장 마감 직전 (서머타임): 한국시간 오전 4시 42분 = UTC 오후 7시 42분
    - cron: '42 19 * * 1-5'
    
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas finance-datareader requests google-genai pytz

      - name: Run Turtle Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
        run: python turtle_bot.py
        
      # (기존에 있던 Commit and push 로직은 영구 삭제되었습니다)
