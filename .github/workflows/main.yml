name: Super Turtle Alarm

on:
  schedule:
    # 🇬🇧 UTC 기준: 00시 13분 (한국 아침 9시 13분) - 덜 붐비는 시간으로 변경!
    - cron: '13 0 * * 1-5'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v3

      - name: 2. Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. Install Dependencies
        run: |
          pip install yfinance finance-datareader google-genai requests pandas beautifulsoup4 lxml

      - name: 4. Run Turtle Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python turtle_bot.py
