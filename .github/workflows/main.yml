name: Turtle Bot Auto Trading

on:
  workflow_dispatch: # 수동 실행 버튼
  schedule:
    # 🌟 1. 한국 주식 종가 베팅 (KST 오후 3시 15분 = UTC 오전 6시 15분)
    - cron: '0 6 * * 1-5'
    
    # 🌟 2. 미국 주식 종가 베팅 (KST 오전 4시 40분 = UTC 오후 7시 40분, 서머타임 기준)
    - cron: '40 19 * * 1-5'

# 🚨 가장 중요한 설정: 봇이 장부를 깃허브에 다시 저장할 수 있도록 쓰기(write) 권한 부여
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4 # 최신 v4 사용 (경고 제거)
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v5 # 최신 v5 사용 (경고 제거)
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance finance-datareader google-genai requests pandas beautifulsoup4 lxml pytz

    - name: Run Turtle Bot
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
        KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
        SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
      run: python turtle_bot.py

    - name: Commit and Push portfolio.json
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add portfolio.json
        # 장부 내용에 변경 사항이 있을 때만 커밋
        git diff --quiet && git diff --staged --quiet || git commit -m "Update portfolio [skip ci]"
        # 충돌 방지를 위해 서버 최신본을 먼저 가져옴
        git pull --rebase origin main
        # 깃허브에 최종 장부 덮어쓰기
        git push
