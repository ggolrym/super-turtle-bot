name: Super Turtle Bot

on:
  schedule:
    # 🇰🇷 한국장: KST 오후 3시 5분 (UTC 06:05)
    # 🇺🇸 미국장: KST 오전 5시 15분 (UTC 20:15)
    - cron: '5 6 * * 1-5'
    - cron: '15 18 * * 1-5'
  workflow_dispatch:

# 🚨 핵심 방어막: 봇 동시 실행 및 충돌 완벽 차단 (자물쇠)
concurrency:
  group: turtle-bot-run
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade pip
      - run: pip install yfinance pandas finance-datareader requests google-genai pytz
      - run: python turtle_bot.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
