name: Super Turtle Alarm

on:
  schedule:
    - cron: '13 0 * * 1-5'
  workflow_dispatch: 
  push:
    branches:
      - main

# 🌟 [추가] 봇이 파일에 쓰기(Commit) 권한을 가질 수 있도록 허가
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v3

      - name: 2. Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. Install Dependencies
        run: |
          pip install yfinance finance-datareader google-genai requests pandas beautifulsoup4 lxml

      - name: 4. Run Turtle Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python turtle_bot.py

      # 🌟 [핵심 추가] 작업이 끝난 후 portfolio.json 장부를 깃허브에 저장(Commit)
      - name: 5. Save Portfolio Memory
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update portfolio memory [skip ci]"
          
          # 🌟 [추가된 해결책] push 하기 전에 깃허브 서버의 최신 상태를 먼저 당겨와서 병합(rebase)합니다.
          git pull --rebase origin main
          
          git push
