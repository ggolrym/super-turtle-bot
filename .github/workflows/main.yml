name: Super Turtle Bot

on:
  schedule:
    # 🇰🇷 목표: KST 14:55 (오차 역산 적용 -> KST 12:45 / UTC 03:45)
    # 기존 1-5(월~금)에서 *(매일)로 변경하여 주말 테스트 허용
    - cron: '45 3 * * *'
    
    # 🇺🇸 목표: KST 04:55 (오차 역산 적용 -> KST 02:45 / UTC 17:45)
    # 기존 1-5(월~금)에서 *(매일)로 변경하여 주말 테스트 허용
    - cron: '45 17 * * *'
  workflow_dispatch:

concurrency:
  group: turtle-bot-run
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade pip
      - run: pip install yfinance pandas finance-datareader requests google-genai pytz
      - run: python turtle_bot.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
