name: Super Turtle Alarm

on:
  schedule:
    # 한국 아침 9시 13분
    - cron: '13 0 * * 1-5'
  workflow_dispatch: 
  push: # 🌟 극약 처방: 코드를 저장(Commit)하면 그 즉시 무조건 1회 자동 실행!
    branches:
      - main # (만약 창고 기본 이름이 master라면 master로 적어주세요)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v3

      - name: 2. Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. Install Dependencies
        run: |
          pip install yfinance finance-datareader google-genai requests pandas beautifulsoup4 lxml

      - name: 4. Run Turtle Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python turtle_bot.py
