name: Turtle Bot Auto Trading

on:
  workflow_dispatch: # 수동 실행 (테스트 및 60일 비활성화 셧다운 리셋용)
  schedule:
    # 🇰🇷 1. 한국 주식 (KOSPI/KOSDAQ) 종가 베팅
    # 매주 월~금요일 오후 3시 17분 실행 (정각 딜레이 방지)
    - cron: '6 15 * * 1-5'
      timezone: 'Asia/Seoul'

    # 🇺🇸 2. 미국 주식 (NYSE/NASDAQ) 종가 베팅
    # 매주 월~금요일 오후 3시 42분 실행 (정각 딜레이 방지)
    # 뉴욕 시간을 쓰면 서머타임(DST) 적용/해제를 GitHub이 알아서 자동 계산합니다!
    - cron: '32 15 * * 1-5'
      timezone: 'America/New_York'

permissions:
  contents: write # 봇이 장부(portfolio.json)를 깃허브에 다시 저장하기 위한 필수 권한

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4 # 최신 v4 사용 (에러/경고 방지)
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v5 # 최신 v5 사용
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance finance-datareader google-genai requests pandas beautifulsoup4 lxml pytz

    - name: Run Turtle Bot
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
        KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
        SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
      run: python turtle_bot.py

    - name: Commit and Push portfolio.json
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add portfolio.json
        # 장부 내용에 변경 사항이 있을 때만 커밋 실행
        git diff --quiet && git diff --staged --quiet || git commit -m "Update portfolio [skip ci]"
        # 충돌을 막기 위해 깃허브 서버의 최신본을 먼저 가져옴
        git pull --rebase origin main
        # 최종 장부를 깃허브에 밀어넣기
        git push

    # 🌟 60일 비활동으로 인한 스케줄러 중지 방어막 (Keepalive)
    # 만약 수개월간 하락장이라 봇이 매매를 전혀 안 하더라도, 
    # 이 액션이 주기적으로 더미(dummy) 활동을 만들어 깃허브가 스케줄러를 강제 종료하는 것을 막아줍니다.
    - name: Keepalive Workflow
      uses: gautamkrishnar/keepalive-workflow@v2
