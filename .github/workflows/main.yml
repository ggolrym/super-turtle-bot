name: Super Turtle Bot

on:
  schedule:
    # 🇰🇷 오후 2시 55분 스캔 시작 -> 오후 3시 정각 알람! (한국장 마감 직전 종가 줍줍)
    - cron: '55 5 * * 1-6'
    # 🇺🇸 새벽 4시 55분 스캔 시작 -> 새벽 5시 정각 알람! (미국장 서머타임 마감 직전 타점)
    - cron: '20 19 * * 1-6'
  workflow_dispatch:

# 🚨 핵심 방어막: 봇 동시 실행 및 충돌 완벽 차단 (자물쇠)
concurrency:
  group: turtle-bot-run
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade pip
      - run: pip install yfinance pandas finance-datareader requests google-genai pytz
      - run: python turtle_bot.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
